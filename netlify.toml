# Configuración para publicar en Netlify (gratis).
# No hay que "compilar" nada: la app son archivos tal cual.
[build]
  publish = "."

# El service worker nunca debe quedarse "viejo" en la caché del navegador
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# Archivos del proyecto que NO son parte de la app: no se sirven en la web
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/preparado/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/servidor.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
