<!DOCTYPE html>
<!--
  ============================================================
  C.D. EL TRANVÍA · App de entrenadores
  ------------------------------------------------------------
  Este es el "esqueleto" de la app. El navegador lee este archivo
  primero. Aquí solo hay la estructura fija (cabecera, zona central
  y menú inferior). El contenido de cada pantalla lo "pinta"
  JavaScript dentro de <main id="vista">.
  ============================================================
-->
<html lang="es" data-theme="auto">
<head>
  <meta charset="utf-8">
  <!-- Hace que la app se adapte al ancho del móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>C.D. El Tranvía · Entrenadores</title>
  <meta name="description" content="App para los entrenadores del C.D. El Tranvía: plantilla, entrenamientos y partidos.">

  <!-- Colores de la barra del navegador en el móvil (claro / oscuro) -->
  <meta name="theme-color" content="#0B2545" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07111F" media="(prefers-color-scheme: dark)">

  <!-- PWA: datos para poder instalarla como una app -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="El Tranvía">

  <!-- Tipografías modernas de Google Fonts (si no hay internet, se usan las del sistema) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">

  <!-- Nuestros estilos (colores, tamaños, diseño) -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- PANTALLA DE CARGA: se ve unos instantes al abrir la app -->
  <div id="splash" aria-hidden="true">
    <img src="assets/icons/escudo-512.png" alt="" class="splash-escudo">
    <div class="splash-nombre">C.D. EL TRANVÍA</div>
    <div class="splash-sub">Área de entrenadores</div>
    <div class="splash-barra"><span></span></div>
  </div>

  <!-- CABECERA: escudo, título de la pantalla y botones rápidos -->
  <header class="cabecera">
    <button class="cab-btn" id="btn-atras" aria-label="Volver" hidden>
      <svg class="ico"><use href="#i-atras"/></svg>
    </button>
    <a href="#/inicio" class="cab-marca" aria-label="Inicio">
      <img src="assets/icons/escudo-512.png" alt="Escudo C.D. El Tranvía" class="cab-escudo">
      <div class="cab-textos">
        <span class="cab-club">C.D. El Tranvía</span>
        <span class="cab-titulo" id="titulo-vista">Inicio</span>
      </div>
    </a>
    <div class="cab-acciones">
      <button class="cab-btn" id="btn-tema" aria-label="Cambiar modo claro/oscuro">
        <svg class="ico"><use href="#i-luna"/></svg>
      </button>
      <a class="cab-btn" href="#/ajustes" aria-label="Ajustes">
        <svg class="ico"><use href="#i-ajustes"/></svg>
      </a>
    </div>
  </header>

  <!-- MENÚ LATERAL (solo en ordenador) y MENÚ INFERIOR (en móvil). Es el mismo menú; el CSS decide dónde se coloca. -->
  <nav class="menu" aria-label="Menú principal">
    <a href="#/inicio" data-tab="inicio"><svg class="ico"><use href="#i-inicio"/></svg><span>Inicio</span></a>
    <a href="#/plantilla" data-tab="plantilla"><svg class="ico"><use href="#i-equipo"/></svg><span>Plantilla</span></a>
    <a href="#/entrenos" data-tab="entrenos"><svg class="ico"><use href="#i-pizarra"/></svg><span>Entrenos</span></a>
    <a href="#/partidos" data-tab="partidos"><svg class="ico"><use href="#i-trofeo"/></svg><span>Partidos</span></a>
    <a href="#/asistente" data-tab="asistente"><svg class="ico"><use href="#i-chispa"/></svg><span>Asistente</span></a>
  </nav>

  <!-- ZONA CENTRAL: aquí se dibuja cada pantalla -->
  <main id="vista" tabindex="-1"></main>

  <!-- Capa para ventanas emergentes (formularios) y avisos -->
  <div id="modal-capa" hidden></div>
  <div id="avisos" aria-live="polite"></div>

  <!--
    ICONOS: los dibujamos una sola vez aquí (formato SVG) y luego los
    reutilizamos en toda la app con <use href="#i-nombre">.

      <symbol id="i-luna" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>

  <!--
    SCRIPTS: el orden importa. Primero las herramientas básicas,
    luego los datos, y al final las pantallas y el arranque.
  -->
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/ejercicios.js"></script>
  <script src="js/datos-ejemplo.js"></script>
  <script src="js/vistas/inicio.js"></script>
  <script src="js/vistas/plantilla.js"></script>
  <script src="js/vistas/entrenos.js"></script>
  <script src="js/vistas/ajustes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
